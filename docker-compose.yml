services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdcs-node
    environment:
      - ROLE=orchestrator
      - PING_TIMEOUT_MS=${PING_TIMEOUT_MS:-200}
      - STORAGE_FAILOVER_STREAK=${STORAGE_FAILOVER_STREAK:-3}
      - RAFT_FAILOVER_STREAK=${RAFT_FAILOVER_STREAK:-3}
    ports:
      - "8080:8080"
    volumes:
      - ./cluster.json:/app/cluster.json
    depends_on:
      - node-01
      - node-02
      - node-03
      - node-04
      - node-05
      - node-06
      - backup-01
      - backup-02
      - raft-01
      - raft-02
      - raft-03
      - raft-04
      - raft-05
      - raft-06
      - raft-07

  node-01:
    image: cdcs-node
    environment:
      - ROLE=storage
      - NODE_ID=Node-01
      - BIND_IP=0.0.0.0:50051
      - CACHE_CAPACITY=${CACHE_CAPACITY:-500}
    ports:
      - "50051:50051"
    volumes:
      - ./data/node-01:/app/storage

  node-02:
    image: cdcs-node
    environment:
      - ROLE=storage
      - NODE_ID=Node-02
      - BIND_IP=0.0.0.0:50051
