services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: cdcs-node
    environment:
      - ROLE=orchestrator
      # 1s, not 200ms: pings share a connection with multi-MB shard transfers,
      # and 3 missed pings in a row trigger an automatic reroute.
      - PING_TIMEOUT_MS=${PING_TIMEOUT_MS:-1000}
      - METADATA_DB_PATH=/app/orchestrator-data/metadata.db
      - STORAGE_FAILOVER_STREAK=${STORAGE_FAILOVER_STREAK:-3}
      - RAFT_FAILOVER_STREAK=${RAFT_FAILOVER_STREAK:-3}
      - CDCS_ADMIN_TOKEN=${CDCS_ADMIN_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      # LAN IPs of the physical PCs (single config file).
      - ./cluster.json:/app/cluster.json
      - ./data/orchestrator:/app/orchestrator-data
    depends_on:
      - node-01
      - node-02
      - node-03
      - node-04
      - node-05
      - node-06
      - backup-01
      - backup-02
      - raft-01
      - raft-02
      - raft-03
      - raft-04
      - raft-05
      - raft-06
      - raft-07

  node-01:
    image: cdcs-node
    environment:
      - ROLE=storage
      - CDCS_ADMIN_TOKEN=${CDCS_ADMIN_TOKEN:-}
      - NODE_ID=Node-01
      - BIND_IP=0.0.0.0:50051
      - CACHE_CAPACITY=${CACHE_CAPACITY:-500}
    volumes:
      - ./data/node-01:/app/storage

  node-02:
